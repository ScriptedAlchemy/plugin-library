<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Plugin Library</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell" id="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <h1>Plugin Library</h1>
          <p class="counts" id="counts">loading…</p>
        </div>
      </div>
      <div class="search">
        <span class="icon" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </span>
        <input type="search" id="search" placeholder="Search plugins and skills" autocomplete="off" aria-label="Search plugins and skills" />
        <kbd>/</kbd>
      </div>
      <div class="segmented" role="group" aria-label="Source">
        <button type="button" data-view="installed" aria-pressed="true">Installed</button>
        <button type="button" data-view="marketplace" aria-pressed="false">Marketplace</button>
      </div>
      <nav class="plugin-list" id="pluginList" aria-label="Plugins"></nav>
    </aside>

    <main class="main">
      <div class="main-inner" id="mainInner"></div>
    </main>

    <aside class="reader" id="reader" aria-label="Reader">
      <div class="reader-head" id="readerHead"></div>
      <div class="reader-tabs" id="readerTabs" role="tablist"></div>
      <div class="reader-body" id="readerBody"></div>
      <div class="reader-foot">
        <span class="status" id="readerStatus"></span>
        <button type="button" class="btn" id="readerApply">Apply to a bot…</button>
      </div>
    </aside>
  </div>

  <div id="pickerRoot" class="hidden"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script src="/markdown.js"></script>
  <script src="/picker.js"></script>
  <script src="/app.js"></script>
</body>
</html>
